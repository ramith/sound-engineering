# Semgrep safety rules for AdaptiveSound.
#
# Run:  semgrep scan --config .semgrep.yml --error   (see `make lint` / strict-gate)
#
# WHY these rules and not the guide's AST rules: semgrep's `swift`/`cpp` AST parsers are
# experimental and unusable here — the Swift parser false-matches plain `try`/`as` (1200+
# bogus hits), and `cpp` mode doesn't even scan .mm (where all the DSP/CoreAudio bridge code
# lives). So every rule below uses `pattern-regex` on tokens that never appear in normal
# comments/strings, and the C++ bans use `languages: [generic]` + an explicit include list
# (verified to scan .mm) so they actually see the bridge code.
#
# DIVISION OF LABOUR:
#   * Swift force-try/force-cast: also caught by SwiftLint (force_try/force_cast = error under
#     `--strict`); kept here as a cheap, config-independent second net.
#   * C++ unbounded string funcs + thread detach: the one class NOT cleanly covered by
#     clang-tidy's enabled set, -Werror, or cppcheck — this is semgrep's load-bearing job.
#     (Memory/UB/race safety stays with clang-tidy + -Werror + ASan/UBSan/TSan; raw new/delete
#     at the reviewed opaque-handle C-ABI boundary is intentional and covered by
#     `make sanitize-library-store`.)
#   * Swift navigation-title (L5): banned — the app owns the window chrome (no native titlebar
#     text), so titles go in-content via ScreenHeader (UI/Shell/ScreenHeader.swift). A companion
#     "no window-sizing .frame(minWidth/minHeight)" ban was CONSIDERED and REJECTED: window
#     sizing is structurally owned by AppShell + WindowMinSize, but many legitimate component
#     frames (device pill, scrubber track, visualizer surface, preset sheet) use minWidth/
#     minHeight, so a token regex would be a false-positive machine — and the ContentView bug it
#     targeted isn't even under UI/. Enforced by review + the AppShell/WindowMinSize ownership.
#
# Reviewed exceptions use a narrow `// nosemgrep: <rule-id>` with the PERMANENT/TEMP + reason
# annotation enforced by scripts/check-suppressions.sh.
rules:
  - id: swift-no-force-try
    languages: [swift]
    severity: ERROR
    message: "Do not use try!. Handle the error (do/catch, try?, or propagate)."
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\btry!)'

  - id: swift-no-force-cast
    languages: [swift]
    severity: ERROR
    message: "Do not use as!. Use conditional casting (as?) and handle nil."
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\bas!)'

  - id: swift-no-navigation-title
    languages: [swift]
    severity: ERROR
    message: >-
      Do not use the navigation-title modifier — this app owns the window chrome (there is no
      native titlebar text to set). Put titles in-content via ScreenHeader
      (Sources/AdaptiveSound/UI/Shell/ScreenHeader.swift).
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.navigationTitle)'

  - id: swift-no-keypress-delete
    languages: [swift]
    severity: ERROR
    message: >-
      A key-press handler for KeyEquivalent.delete never fires on macOS: the ⌫ key arrives as
      U+007F, but .delete is U+0008 (S10.8 founder bug — the queue's Delete was dead). Use
      .onDeleteCommand(perform:), the system Delete command (⌫, ⌦ and Edit ▸ Delete; a nil
      action disables it). .deleteForward is U+F728 — ⌦'s own NSDeleteFunctionKey — so not flagged.
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.onKeyPress\([^)\n]*\.delete\b)'

  # S10.8 G (the disconnect freeze): the main thread must never wait on the audio side. Every
  # AVFAudio accessor on a node of a live engine (`.auAudioUnit` of an attached unit included) takes
  # ONE engine-wide lock, which a stop or start holds across the HAL's waits — ~7 s on a headphone
  # switch-off. The app reaches the engine only through AudioPlaybackEngine, whose synchronous
  # surface is copy-or-hand-off only: snapshot() (one EngineSnapshot), the publishes (borrowing the
  # AU via withEffectsAU), requestDeviceVolume (queued), the spectrum / monitor reads, the pin and
  # device id. Everything that touches the hardware lives in the bridge's own files, on its queues.
  # So outside them: no engine-bound AVFAudio type (AVAudioFile / Format / PCMBuffer / Time are
  # plain data and stay allowed), no AVFAudio or HAL accessor of the bridge, no HAL / AU / Pure C
  # call, no `.sync` onto a bridge queue. The DEBUG stall self-test holds the lock on purpose.
  - id: main-thread-no-audio-hardware
    languages: [swift]
    severity: ERROR
    message: >-
      Only the engine bridge (AudioEngineBridge*.swift, PureModeSession.swift) may touch AVFAudio engine objects, the
      CoreAudio HAL, the Pure C-ABI or the bridge's queues: from the app they can wait seconds on
      AVFAudio's engine-wide lock while macOS reconfigures a device, freezing the main thread
      (S10.8 G). Read engine state from AudioPlaybackEngine.snapshot(); send work through an async
      or queued engine method (see docs/architecture/architecture.md, "Threading rules").
    paths:
      include:
        - 'Sources/AdaptiveSound/'
      exclude:
        - 'Sources/AdaptiveSound/AudioEngineBridge*.swift'
        - 'Sources/AdaptiveSound/PureModeSession.swift'
        - 'Sources/AdaptiveSound/Debug/MainThreadStall*.swift'
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\bAVAudio(?!File\b|Format\b|PCMBuffer\b|Time\b|ChannelLayout\b|FrameCount\b|FramePosition\b|Converter\b)[A-Z]\w*|\.auAudioUnit\b|\b(playerNodeRef|avEngineRef|effectsNode|spatialNode|playerNode|avEngine)\b|\bpureMode\w+\(|\bAudio(Object(Get|Set|Has|Add|Remove|Is)|Unit(Get|Set|Initialize|Uninitialize|Render|Reset)|OutputUnit(Start|Stop)|Device(Start|Stop|GetProperty|SetProperty|CreateIOProc|DestroyIOProc)|Hardware)\w*\(|\bDeviceHardwareVolume\.|\b(getDefaultOutputDeviceID|selectOutputDeviceC|enumerateOutputDevicesC|isListedOutputDeviceC)\(|\b(engineQueue|resampleQueue|configChangeQueue|deviceVolumeQueue)\.sync\b)'

  - id: coreaudio-listener-not-on-main
    languages: [swift]
    severity: ERROR
    message: >-
      A CoreAudio property listener must not run on the main queue: its handler reads the HAL, and
      the HAL fires listeners while it tears a device down — the read would wait on the device's
      lock on the main thread (S10.8 G). Give it a bridge queue and publish into a snapshot.
    # Two nets: a main queue named inside the call (or the AudioPropertyListener wrapper's), and an
    # allowlist on the raw call's queue argument — `let q = DispatchQueue.main` then `q` names no main.
    pattern-either:
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:(AudioObject(Add|Remove)PropertyListenerBlock|AudioPropertyListener)\([\s\S]{0,160}?(DispatchQueue\.main|\.main\b|mainQueue))'
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:AudioObject(Add|Remove)PropertyListenerBlock\(\s*[^,()]+,\s*[^,()]+,(?!\s*(queue|deviceVolumeQueue|configChangeQueue)\s*,))'

  # The rule above names the bridge's accessors, but a downcast reaches every other member of the
  # concrete class — `(engine as? AudioEngineBridge)?.applyMasterGain()` takes the engine-wide lock
  # from the main thread under any name. So outside the bridge the app never names the concrete
  # type: it holds `any AudioPlaybackEngine`. The one exception is the composition default in the
  # view model's init (plus the DEBUG stall self-test, which drives the real bridge on purpose).
  # Comment lines are skipped (the docs may name the bridge's files).
  - id: main-thread-no-concrete-bridge
    languages: [swift]
    severity: ERROR
    message: >-
      The app reaches the engine only through AudioPlaybackEngine: naming the concrete
      AudioEngineBridge (a downcast, a stored reference) reaches its queue-confined members — AVFAudio
      calls under the engine-wide lock — from the main thread, past the main-thread rule (S10.8 G).
      Add what you need to AudioPlaybackEngine as a snapshot field or an async / queued method.
    paths:
      include:
        - 'Sources/AdaptiveSound/'
      exclude:
        - 'Sources/AdaptiveSound/AudioEngineBridge*.swift'
        - 'Sources/AdaptiveSound/PureModeSession.swift'
        - 'Sources/AdaptiveSound/Debug/MainThreadStall*.swift'
    pattern-regex: '(?m)^(?!\s*//)(?!.*\bengine: any AudioPlaybackEngine = AudioEngineBridge\(\)).*\bAudioEngineBridge\b'

  # The bridge is engine code, NOT main-actor code (AudioEngineBridge.swift's header): a @MainActor
  # member in its own files would run its AVFAudio / HAL reads on the main thread with the
  # main-thread rule above blind to it.
  - id: bridge-not-main-actor
    languages: [swift]
    severity: ERROR
    message: >-
      The engine bridge's own files hold engine code: no @MainActor declaration here — it would put
      AVFAudio / HAL reads on the main thread where the main-thread rule cannot see them (S10.8 G).
      Put main-thread code in the view model and reach the engine through AudioPlaybackEngine.
    paths:
      include:
        - 'Sources/AdaptiveSound/AudioEngineBridge*.swift'
        - 'Sources/AdaptiveSound/PureModeSession.swift'
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:^\s*@MainActor\b)'

  # S10.8 C1: the isolated test library is only isolated if NOTHING picks its own place to persist.
  - id: persist-one-location
    languages: [swift]
    severity: ERROR
    message: >-
      Persistence outside AppDataLocation. The launch decides once where the app persists (the
      user's library, or a debug build's isolated test library) and injects it: the store and
      artwork paths, the lock, and the defaults (`@AppStorage` reads them via .defaultAppStorage).
      The standard defaults, an Application Support or Caches path, or an explicit @AppStorage
      store would write the user's data from a test-library run. Take AppDataLocation instead.
    paths:
      include: ['Sources']
      exclude: ['Sources/AdaptiveSound/AppDataLocation.swift']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\bUserDefaults\.standard\b|\bUserDefaults\(\s*\)|UserDefaults\s*=\s*\.standard\b|\bdefaults:\s*\.standard\b|\b(applicationSupport|caches)Directory\b|@AppStorage\([^)\n]*\bstore:)'

  - id: cpp-no-unsafe-string-fn
    languages: [generic]
    severity: ERROR
    message: >-
      Unbounded C string function. Use a bounds-checked alternative: snprintf (with size),
      strlcpy/strlcat, std::string, or std::span.
    paths:
      include: ['*.c', '*.cc', '*.cpp', '*.mm', '*.h', '*.hpp']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\b(strcpy|strcat|sprintf|vsprintf|stpcpy|gets)\s*\()'

  - id: cpp-no-thread-detach
    languages: [generic]
    severity: ERROR
    message: "Do not detach threads. Use std::jthread or structured ownership (Audio Workgroups / GCD)."
    paths:
      include: ['*.c', '*.cc', '*.cpp', '*.mm', '*.h', '*.hpp']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.detach\s*\()'

  # R1.1-B (level-and-fold §7, M8): the session AGC is deleted. The level is the planner's leveling gain under
  # the peak cap (Planning/TrackPlan, Loudness/TrackLoudnessGain) — a second, adaptive leveller must never come
  # back. Code lines only: a comment may still tell the history.
  - id: cpp-no-session-agc
    languages: [generic]
    severity: ERROR
    message: >-
      The session loudness normaliser (LoudnessModule / LoudnessParams) was deleted in R1.1-B (M8): leveling is
      the planner's frozen per-track gain under the peak cap. Don't bring back an adaptive leveller.
    paths:
      include: ['*.c', '*.cc', '*.cpp', '*.mm', '*.h', '*.hpp', '*.inc', '*.swift']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?\b(?:LoudnessModule|LoudnessParams)\b'

  # --- S10.7 layer-policy tripwires (docs/sprints/s10-7-liquid-glass-design.md §3.1/§3.2/§7 R1).
  # Drift nets, not security boundaries (same posture as the migrator grep): helper indirection
  # and legal-token recomposition can evade regexes — review owns that seam (design §7.4-1).
  # The DEFINITION files (DesignSystem, DesignSystemGlass[Controls], Color+Brand) are the only
  # exceptions — they are where color/material IS defined. (SpectrumColorPalette left the list in
  # S10.8 B2a: the analyzer ramp is Kit data now, `SpectrumRamp`.)

  - id: ui-no-adhoc-material
    languages: [swift]
    severity: ERROR
    message: >-
      Backdrop-sampling material outside the token layer. App glass-look surfaces are
      token-governed fills via .glassPanel(_:in:) (design §3.1 Regime B); the ONE sanctioned
      Material use (a transient overlay with variable content genuinely beneath) is the
      .overlay role inside DesignSystemGlass.swift. Declare a role, don't paint a material.
    paths:
      include: ['Sources/AdaptiveSound']
      exclude: ['DesignSystem.swift', 'DesignSystemGlass.swift', 'Color+Brand.swift']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.(ultraThin|thin|regular|thick|ultraThick)Material\b|\bMaterial\.|\bNSVisualEffectView\b|\.background\(\s*\.bar\b)'

  - id: no-liquid-glass-api
    languages: [swift]
    severity: ERROR
    message: >-
      Liquid Glass API use is FROZEN for S10.7 — no app surface has variable content beneath
      it (design §3.1 placement test), so glassEffect would be cited "ghost glass". This rule
      is NEVER suppressed: adopting real glass means EDITING THIS RULE in the same PR as the
      design review that sanctions the under-content surface (see DesignSystemGlass.swift's
      header). Suppression = hack; rule edit + design review = policy evolution.
    paths:
      include: ['Sources']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.glassEffect(ID|Union|Transition)?\s*\(|\bGlassEffectContainer\b|\bNSGlassEffectView\b|buttonStyle\(\s*\.glass)'

  - id: ui-no-color-literal
    languages: [swift]
    severity: ERROR
    message: >-
      Hand-painted color in a view. All color comes from DesignTokenKit data via DesignSystem
      tokens (light+dark pairs, permanently contrast-audited by R4) so appearance, Reduce
      Transparency, and Increase Contrast stay correct everywhere. Add/extend a Palette token
      instead. (Color.clear is deliberately allowed — absence of paint, not a color; hierarchical
      styles like .secondary are vibrancy styles, not colors, and are also fine.)
    paths:
      include: ['Sources/AdaptiveSound']
      # PATH-ANCHORED (break-it hardening): bare basenames matched ANY file with that name
      # anywhere under the include — a new UI/Foo/DesignSystem.swift was silently exempt.
      exclude:
        - 'Sources/AdaptiveSound/DesignSystem.swift'
        - 'Sources/AdaptiveSound/DesignSystemGlass.swift'
        - 'Sources/AdaptiveSound/Color+Brand.swift'
    pattern-either:
      # Colorspace prefix generalized (break-it hardening): `Color(.displayP3, red:)` evaded
      # the .sRGB-only group — and P3 is exactly what the R4 audit cannot model.
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\b(Color|NSColor)\(\s*(\.[A-Za-z0-9]+\s*,\s*)?(srgbRed|calibratedRed|deviceRed|red|white|hue)\s*:|#colorLiteral|\bColor\(\s*named:|\bColor\(\s*")'
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.(foregroundStyle|foregroundColor|fill|tint|stroke|strokeBorder|background|overlay|border)\(\s*(SwiftUI\.Color\.|Color\.|\.)(red|black|white|blue|green|orange|yellow|pink|purple|teal|mint|cyan|indigo|brown|gray)\b)'
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.shadow\(\s*color:\s*(SwiftUI\.Color\.|Color\.|\.)(red|black|white|blue|green|orange|yellow|pink|purple|teal|mint|cyan|indigo|brown|gray)\b)'
      - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:NSColor\.system(Red|Blue|Green|Orange|Yellow|Pink|Purple|Teal|Mint|Cyan|Indigo|Brown|Gray)\b)'

  - id: ui-no-appearance-branching
    languages: [swift]
    severity: ERROR
    message: >-
      Per-view appearance branching. Appearance is owned by the dynamic token layer (S9-T
      posture, enforced since S10.7) and by the .glassPanel env->resolver shim in
      DesignSystemGlass.swift; forcing preferredColorScheme breaks follow-the-system. Use
      DesignSystem tokens.
    paths:
      include: ['Sources/AdaptiveSound']
      # PATH-ANCHORED, like ui-no-color-literal. DesignSystemGlassControls (S10.8 B) holds the
      # carved slider + glass switch, split out of DesignSystemGlass under its length budget.
      exclude:
        - 'Sources/AdaptiveSound/DesignSystemGlass.swift'
        - 'Sources/AdaptiveSound/DesignSystemGlassControls.swift'
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\\\.colorScheme\b|\.preferredColorScheme\s*\(|NSApp\.appearance\s*=)'

  # --- S10.8 A2 accent-role tripwires (docs/sprints/s10-8-glass-sweep-plan.md §E, Sprint A).
  # Same posture as the ui-* rules above: single-line regex drift nets, not an AST check —
  # a multi-line ternary or a color passed through a parameter evades them; review owns that.

  - id: ui-no-bordered-prominent
    languages: [swift]
    severity: ERROR
    message: >-
      The system prominent buttons (bordered-prominent and glass-prominent, by shorthand or by
      type) draw a WHITE label on the tint — on the teal that fails WCAG AA (≈ 2.5:1 on accent,
      ≈ 4.3:1 even on accentDeep). Primary actions use the teal pill: .buttonStyle(.pill)
      (UI/Controls/PillButtonStyle.swift — dark-on-teal, audited by R4-TAB-01).
    paths:
      include: ['Sources/AdaptiveSound']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\.(borderedProminent|glassProminent)\b|\b(BorderedProminent|GlassProminent)ButtonStyle\()'

  - id: ui-no-accent-as-text
    languages: [swift]
    severity: ERROR
    message: >-
      The bare accent as a text/glyph color fails contrast in light (≈ 2.2:1). Teal TEXT and
      GLYPHS use DesignSystem.Color.accentForeground (AA, R4-TINT-02); tints, fills and a
      glyph's fill layer use accentFill (R4-TINT-01). Both keep the bare accent's dark value,
      so dark looks are unchanged. Decorative strokes/washes keep accent. Single-line regex,
      not AST (like the other ui-* rules): it sees one foregroundStyle( call per line only.
    paths:
      include: ['Sources/AdaptiveSound']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:foregroundStyle\([^)\n]*(DesignSystem\.Color\.accent|Color\.asAccent|\.asAccent)\b)'

  # --- S10.8 D2 (docs/sprints/s10-8-glass-sweep-plan.md §E, Sprint D): ONE filter field.
  - id: ui-no-raw-text-field
    languages: [swift]
    severity: ERROR
    message: >-
      A raw text field in the app. Every in-place filter is the shared FilterPill
      (UI/Controls/FilterPill.swift): one look, its own focus and transport-Space gate (a typed
      space is a space, not play / pause) and Escape to clear — the hand-built queue and picker
      fields had drifted from all three. The only other text entry is the playlist rename field
      (UI/Library/LibrarySidebar+Rename.swift) and the Save Preset sheet
      (UI/EQ/SaveCustomPresetView.swift). Use FilterPill; a genuinely new kind of text entry is
      added to this rule's allow-list in review. Covers every text-entry control: SwiftUI's
      TextField, SecureField, TextEditor and .searchable, and AppKit's NSTextField, NSSearchField,
      NSSecureTextField, NSTokenField, NSComboBox (and a ComboBox wrapper), NSSearchToolbarItem and
      NSTextView — editable unless told otherwise, which a regex can't see; display-only text is a
      SwiftUI Text. Comment lines are not matched.
    paths:
      include: ['Sources/AdaptiveSound']
      # PATH-ANCHORED, like ui-no-color-literal: a bare basename would exempt any file of that name.
      exclude:
        - 'Sources/AdaptiveSound/UI/Controls/FilterPill.swift'
        - 'Sources/AdaptiveSound/UI/Library/LibrarySidebar+Rename.swift'
        - 'Sources/AdaptiveSound/UI/EQ/SaveCustomPresetView.swift'
    pattern-regex: '(?m)^(?!\s*//).*(\b(TextField|SecureField|TextEditor|ComboBox|NSTextField|NSSearchField|NSSecureTextField|NSTokenField|NSComboBox|NSSearchToolbarItem|NSTextView)\b|\.searchable\s*\()'

  # --- S10.8 E1 (docs/sprints/s10-8-glass-sweep-plan.md §E, COL-01): the selection kit is for EVERY list.
  # E2/E3 add the detail pages' list kit (DetailTrack*): the pages ignore Songs' columns and sort too.
  - id: selection-kit-no-columns
    languages: [swift]
    severity: ERROR
    message: >-
      The selection kit (ListSelection, TypeSelectBuffer, ListKeyboardCursor) and the detail pages'
      list kit (DetailTrack, DetailTrackArrangement, DetailTrackLayout, AlbumTrackOrder) must not
      depend on Songs' columns, sort or row type (COL-01): the album, artist and genre pages have
      none of them. A list hands the selection kit its rows' ids in display order and, for
      type-to-select, the title it shows; the detail kit sees a song only through `DetailTrack` (id,
      title, album, disc and track number). Comment lines are not matched.
    paths:
      include:
        - 'Sources/LibraryBrowseKit/ListSelection.swift'
        - 'Sources/LibraryBrowseKit/TypeSelectBuffer.swift'
        - 'Sources/LibraryBrowseKit/ListKeyboardCursor.swift'
        - 'Sources/LibraryBrowseKit/DetailTrack.swift'
        - 'Sources/LibraryBrowseKit/DetailTrackArrangement.swift'
        - 'Sources/LibraryBrowseKit/DetailTrackLayout.swift'
        - 'Sources/LibraryBrowseKit/AlbumTrackOrder.swift'
        - 'Sources/LibraryBrowseKit/DetailListMetrics.swift'
        - 'Sources/LibraryBrowseKit/DiscFolder.swift'
    pattern-regex: '(?m)^(?!\s*//).*(\b(SongColumn\w*|SongSortMapping|SortOrder|KeyPathComparator|LibraryTrackDisplay)\b|^\s*import\s+LibraryStore\b)'

  # --- S10.8 C2 (docs/sprints/s10-8-glass-sweep-plan.md §E, ALB-04): ONE missing-artist string.
  - id: library-one-unknown-artist-string
    languages: [swift]
    severity: ERROR
    message: >-
      A missing artist reads the same everywhere (ALB-04): use `unknownArtistName` (LibraryStore,
      the id-0 sentinel row's own name) or `LibraryTrackDisplay.artistDisplayName` — never a
      second "Unknown Artist" literal, which is how the Songs cell drifted to blank while the
      Albums grid and the footer said "Unknown Artist". Comment lines are not matched.
    paths:
      include: ['Sources']
      exclude: ['Sources/LibraryStore/Schema.swift']
    pattern-regex: '(?m)^(?!\s*//).*"Unknown Artist"'

  # Test-rig redesign, rule 1: time only ever breaks hangs. A Swift test waits for a STATE (RigKit's
  # `until`, `untilOnMainRunLoop`, `Hold`) and keeps blocking work off the cooperative pool (`blocking`),
  # whose cap fails loudly naming the state. A sleep, a nested run-loop window, a semaphore with no
  # timeout or a wall-clock deadline is a guess about the machine: a slow runner turns a positive check
  # red and a negative one vacuously green (ANALYZER-05, LiveReadouts S5-S7, R4). Only RigKit itself
  # (the primitives, each proven to fail loudly) may touch the raw clock. A clock INSTANT used as an
  # injected `now` (`let start = ContinuousClock.now`, handed to a pure decision) is deterministic and
  # not flagged: it is arithmetic on it (`now + …`, `now < …`) that makes a deadline.
  - id: test-no-raw-time
    languages: [swift]
    severity: ERROR
    message: >-
      A raw wait in a test. Wait for the STATE with RigKit — `try await until("what", cap:) { … }`
      (`untilOnMainRunLoop` for a main-queue or timer source, `Hold`/`withHold` to keep a producer until
      the test releases it, `blocking {}`/`OffPoolExecutor` for blocking code) — never Thread.sleep,
      Task.sleep, usleep, `RunLoop.run(until:)`, a DispatchSemaphore, or a ClockInstant deadline. A negative
      check ("X did not happen") needs a positive witness that X had its chance, not a window of time.
    paths:
      include: ['Tests']
      exclude: ['Tests/RigKit']
    pattern-regex: '(?m)^(?!\s*(?://|/\*|\*)).*?(?:\bThread\.sleep\b|\bTask\.sleep\(|\busleep\(|\bRunLoop\.(?:main|current)\.run\(until|\bDispatchSemaphore\b|\b(?:Continuous|Suspending)Clock\.now\s*[-+<>])'

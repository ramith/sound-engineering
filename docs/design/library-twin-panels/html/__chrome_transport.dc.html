<script type="text/x-dc" data-dc-script data-props="{&quot;reduceMotion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rm = this.props.reduceMotion ?? false;
    const dot = 'display:inline-block;width:6px;height:6px;border-radius:50%;background:#3fd0ba;box-shadow:0 0 6px rgba(63,208,186,.8);' + (rm ? '' : 'animation:lbDot 1.6s ease-in-out infinite;');
    return { dot };
  }
}
</script>

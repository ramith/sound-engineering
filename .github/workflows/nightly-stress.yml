name: Nightly stress

# Advisory (schedule and on demand): repeats the concurrency-sensitive suites under the CI-like
# profile (make stress) — Swift by type or function name, the C++ null test's Concurrent tier
# shuffled, and the verifiers with ONE cooperative thread (the profile that found the store
# verifier's mid-scan deadlock). It never blocks a merge. A failure is a flake to FIX the same day,
# not retry.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "swift --filter regex to stress (function or type names, not @Test display names)"
        required: true
        default: "TrackLoudnessAnalyzerTests|LiveReadoutsTests"
      n:
        description: "iterations"
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: nightly-stress
  cancel-in-progress: false

jobs:
  stress:
    name: stress (advisory)
    runs-on: xcode-27
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Stress the Swift suites (CI-like profile, strict pool)
        env:
          TEST: ${{ inputs.test || 'TrackLoudnessAnalyzerTests|LiveReadoutsTests' }}
          N: ${{ inputs.n || '20' }}
        run: make stress
      - name: Stress the C++ Concurrent tier (repeated, shuffled, printed seed)
        if: ${{ !cancelled() }}
        env:
          KIND: cpp
          TEST: "Concurrent.*"
          N: ${{ inputs.n || '20' }}
        run: make stress
      - name: The verifiers with one cooperative thread
        if: ${{ !cancelled() }}
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: scripts/gate/run.sh --step verify-library-store --step verify-au-graph --step main-thread-stall
      - name: Upload the stress logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-stress
          path: .build/gate/
          if-no-files-found: warn

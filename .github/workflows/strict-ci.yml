name: Strict CI

# The full gate (scripts/gate/run.sh --tier ci), as parallel jobs plus ONE summary check named
# `strict-gate`. Every job runs its registry steps to completion; the `strict-gate` check reads all
# of them and is red if any blocking step failed, timed out, or was missing. Local `make strict-gate`
# runs the same registry, so the two cannot diverge.

on:
  pull_request:
  push:
    branches: [main]
  # On demand, on any branch: a planted-failure proof or a debugging run, without opening a PR.
  workflow_dispatch:

# A superseded PR run is cancelled to save runner time. A run on main is NEVER cancelled: main's run
# on the merge commit is the real gate, and the founder merges by hand, sometimes mid-run.
concurrency:
  # Pull requests: one run per ref, a newer push cancels the older. Everything else (main, dispatch): each
  # run gets its OWN group, so a pending main run is never replaced by a later push (GitHub keeps one
  # pending run per group and cancels it when a third arrives). Main runs are never cancelled.
  group: strict-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: static (parity, format, lint, analysis, dead code)
    runs-on: xcode-27
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Run the static steps
        env:
          # The gate's output lives outside .build: a PR cache can never restore an old run's results.
          GATE_RUN_DIR: ${{ runner.temp }}/gate/static
        run: scripts/gate/run.sh --job static
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-static
          path: ${{ runner.temp }}/gate/static
          overwrite: true
          if-no-files-found: warn

  swift:
    name: swift (build, swift test, main-thread stall)
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Cache SwiftPM checkouts (keyed by Package.resolved)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-checkouts-${{ hashFiles('Package.resolved') }}
      - name: Cache .build (PR runs only; main always builds cold)
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            build-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Run the swift steps
        env:
          # The gate's output lives outside .build: a PR cache can never restore an old run's results.
          GATE_RUN_DIR: ${{ runner.temp }}/gate/swift
        run: scripts/gate/run.sh --job swift
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-swift
          path: ${{ runner.temp }}/gate/swift
          overwrite: true
          if-no-files-found: warn

  cpp:
    name: cpp (null test, verifiers, -O2, coverage guard, leaks)
    runs-on: xcode-27
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Cache SwiftPM checkouts (keyed by Package.resolved)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-checkouts-${{ hashFiles('Package.resolved') }}
      - name: Cache .build (PR runs only; main always builds cold)
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-cpp-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            build-cpp-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Run the cpp steps
        env:
          # The gate's output lives outside .build: a PR cache can never restore an old run's results.
          GATE_RUN_DIR: ${{ runner.temp }}/gate/cpp
        run: scripts/gate/run.sh --job cpp
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-cpp
          path: ${{ runner.temp }}/gate/cpp
          overwrite: true
          if-no-files-found: warn

  asan:
    name: asan (null test ASan+UBSan, store ASan)
    runs-on: xcode-27
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Run the asan steps
        env:
          # The gate's output lives outside .build: a PR cache can never restore an old run's results.
          GATE_RUN_DIR: ${{ runner.temp }}/gate/asan
        run: scripts/gate/run.sh --job asan
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-asan
          path: ${{ runner.temp }}/gate/asan
          overwrite: true
          if-no-files-found: warn

  tsan:
    name: tsan (null test ThreadSanitizer)
    runs-on: xcode-27
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-gate
      - name: Run the tsan steps
        env:
          # The gate's output lives outside .build: a PR cache can never restore an old run's results.
          GATE_RUN_DIR: ${{ runner.temp }}/gate/tsan
        run: scripts/gate/run.sh --job tsan
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-tsan
          path: ${{ runner.temp }}/gate/tsan
          overwrite: true
          if-no-files-found: warn

  # The single summary check. Runs on Linux (no macOS slot) and always runs, so a job that was
  # cancelled, timed out or crashed is reported as missing, not silently green.
  report:
    name: strict-gate
    needs: [static, swift, cpp, asan, tsan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every job's gate logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-*
          path: gate-results
      - name: Write the one table and the verdict
        run: scripts/gate/report.sh gate-results

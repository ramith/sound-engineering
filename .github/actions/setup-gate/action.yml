# Composite action: select the pinned Xcode (27.1), restore the toolchain cache, and install the pinned
# toolchain from toolchain/toolchain.env. Every gate job uses this, so each job starts from the
# SAME tools the local install script installs (one manifest, Mac and CI).
name: setup-gate
description: Select the pinned Xcode and install the pinned gate toolchain from the manifest.

runs:
  using: composite
  steps:
    # The semgrep venv is built for the manifest's Python (M2). The image default is newer (3.15), so the pinned
    # minor is installed explicitly (actions/setup-python, pinned by SHA). It must equal PYTHON_VERSION in the
    # manifest: scripts/toolchain/check.sh asserts the interpreter's version on every run, CI included.
    - name: Python for the semgrep venv (pinned minor)
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Select the pinned Xcode (from toolchain/toolchain.env)
      shell: bash
      run: |
        set -euo pipefail
        set -a; source toolchain/toolchain.env; set +a
        # The manifest names the app path (Xcode_27.1.app, an alias of the 27.1 Release Candidate build).
        sudo xcode-select -s "$XCODE_APP_PATH"
        xcodebuild -version
        swift --version
        sw_vers

    # Tool downloads, keyed by the manifest content. The install script verifies every checksum on
    # restore as well, so a restored cache can never smuggle in an unverified binary.
    - name: Restore the toolchain cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/adaptivesound-toolchain
        key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain/toolchain.env', 'scripts/toolchain/semgrep-requirements.txt') }}

    - name: Install the pinned toolchain (scripts/toolchain/install.sh)
      shell: bash
      run: scripts/toolchain/install.sh

    # The FFmpeg headers (libavformat under /opt/homebrew/include) are how FileDecodeSource's FFmpeg
    # branch is analysed at all. Installed here, checked by the parity step; a failed install is red.
    # FFmpeg is INFO only: an install failure, or any FFmpeg version, can never fail the gate or a release.
    # The C++ analysis of the FFmpeg branch runs when the headers are present, and parity says which it is.
    # HOMEBREW_NO_AUTO_UPDATE stops Homebrew updating itself mid-run.
    - name: Install the FFmpeg headers (INFO only, cannot fail the gate)
      shell: bash
      continue-on-error: true
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install ffmpeg

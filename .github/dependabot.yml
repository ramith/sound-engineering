version: 2
updates:
  # GitHub Actions: every action is pinned by full commit SHA with the version in a comment, and
  # Dependabot proposes the new SHA with the comment updated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # SwiftPM dependencies (GRDB for the library store; swift-clocks arrives as a test-only dependency).
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
